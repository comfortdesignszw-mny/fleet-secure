name = "fleet-secure"
compatibility_date = "2025-02-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "DB"
database_name = "fleet-secure"
database_id = "61daa03c-7307-4132-b07b-9bbaba5aa3ff"
migrations_dir = "migrations"

[vars]
APP_TIMEZONE = "Africa/Harare"
INITIAL_ADMIN_USERNAME = "admin"
INITIAL_ADMIN_NAME = "System Administrator"
ALLOW_PREVIEW_SIGNUP = "false"

[assets]
directory = "./dist"
# Set secrets via Cloudflare Pages dashboard or `wrangler pages secret put`:
# SESSION_SECRET
# INITIAL_ADMIN_PIN
# RESEND_API_KEY
# EMAIL_FROM
