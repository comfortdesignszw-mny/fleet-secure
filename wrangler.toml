name = "fleet-secure"
main = "src/index.ts"
compatibility_date = "2025-02-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "fleet-secure"
# Omit database_id so Wrangler v4 can auto-provision or match the D1 database in CI,
# or set your existing D1 UUID explicitly if you already created one:
# database_id = "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
migrations_dir = "migrations"

[triggers]
crons = ["0 * * * *"]

[vars]
APP_TIMEZONE = "Africa/Harare"
INITIAL_ADMIN_USERNAME = "admin"
INITIAL_ADMIN_NAME = "Munyaradzi Muchineripi"
ALLOW_PREVIEW_SIGNUP = "false"
# Set secrets via Cloudflare Workers dashboard or `npx wrangler secret put`:
# SESSION_SECRET
# INITIAL_ADMIN_PIN
# RESEND_API_KEY
# EMAIL_FROM
